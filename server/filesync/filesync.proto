syntax = "proto3";

option go_package = "/filesync";
option java_package = "jon.filesync";

package filesync;

service FileSync {
    rpc SendFileInfo (stream FileInfoRequest) returns (stream FileInfoReply) {}
    rpc SendFiles (stream FileChunk) returns (FileReply) {}
}

message FileInfoRequest {
    string path = 1;
    string hash = 2;
}

message FileInfoReply {
    string path = 1;
    string hash = 2;
    bool shouldsend = 3;
}

message FileChunk {
    string path = 1;
    bytes contents = 2;
}

message FileReply {
    string path = 1;
    bool received = 2;
}