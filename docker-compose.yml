version: "3.8"

services:
  snaphaven:
    build:
      context: .
      dockerfile: Dockerfile
    image: snaphaven/server:latest
    container_name: snaphaven-server
    restart: unless-stopped
    ports:
      - "50005:50005"
    environment:
      - HEADLESS=true
      - SNAP_DIR=/data/photos
      - SNAP_PORT=:50005
    volumes:
      - ./storage/photos:/data/photos
      - ./storage/config:/config
