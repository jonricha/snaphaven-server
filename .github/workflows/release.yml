name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Go Server Executable
        run: |
          cd server
          go build -o photosync_server.exe .
          Copy-Item photosync_server.exe ..\windowsservice\photosync_server.exe -Force

      - name: Compile NSIS Installer
        run: |
          cd windowsservice
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            & $makensis filesync.nsi
          } else {
            makensis filesync.nsi
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: windowsservice/PhotoSyncInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
