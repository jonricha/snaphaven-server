name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Build Windows Server & Installer
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows (NSIS Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Run Server Unit Tests
        run: |
          cd server
          go test -v ./...

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Go Server Executable
        run: |
          cd server
          $TAG = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $BUILDDATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss UTC")
          go build -ldflags "-X 'main.Version=$TAG' -X 'main.Commit=${{ github.sha }}' -X 'main.BuildTime=$BUILDDATE' -H=windowsgui" -o snaphaven.exe .
          Copy-Item snaphaven.exe ..\windowsservice\snaphaven.exe -Force

      - name: Compile NSIS Installer
        run: |
          cd windowsservice
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            & $makensis snaphaven.nsi
          } else {
            makensis snaphaven.nsi
          }

      - name: Build MSIX Package (Microsoft Store)
        run: |
          $TAG = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "v1.0.0" }
          & .\msix\build_msix.ps1 -Tag $TAG -ExecutablePath .\server\snaphaven.exe -OutputDir .\msix\dist

      - name: Upload Windows Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            windowsservice/SnapHavenInstaller.exe
            msix/dist/*.msix
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 2. Build macOS Server (Apple Silicon & Intel)
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS (ARM64 & AMD64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Run Server Unit Tests on macOS Runner
        run: |
          cd server
          CGO_ENABLED=1 go test -v -ldflags="-linkmode=external" ./...

      - name: Build macOS App Bundle & Packaging
        run: |
          chmod +x macservice/build_mac_app.sh
          ./macservice/build_mac_app.sh

      - name: Build & Sign Mac App Store Package (.pkg)
        timeout-minutes: 10
        env:
          MAC_APP_CERT_P12: ${{ secrets.MAC_APP_CERT_P12 }}
          MAC_INSTALLER_CERT_P12: ${{ secrets.MAC_INSTALLER_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAS_PROVISION_PROFILE_B64: ${{ secrets.MAS_PROVISION_PROFILE_B64 }}
          MAC_APP_SIGN_IDENTITY: ${{ secrets.MAC_APP_SIGN_IDENTITY }}
          MAC_INSTALLER_SIGN_IDENTITY: ${{ secrets.MAC_INSTALLER_SIGN_IDENTITY }}
        run: |
          if [ -z "$MAC_APP_CERT_P12" ] || [ -z "$MAC_INSTALLER_CERT_P12" ] || [ -z "$MAS_PROVISION_PROFILE_B64" ]; then
            echo "MAS signing secrets not configured; skipping Mac App Store .pkg build."
            exit 0
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/mas-build.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 16)"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security default-keychain -s "$KEYCHAIN_PATH"

          echo "$MAC_APP_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mac_app.p12"
          echo "$MAC_INSTALLER_CERT_P12" | base64 --decode > "$RUNNER_TEMP/mac_installer.p12"
          echo "$MAS_PROVISION_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/mas.provisionprofile"

          curl -sSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -A
          security import "$RUNNER_TEMP/mac_app.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$RUNNER_TEMP/mac_installer.p12" -k "$KEYCHAIN_PATH" -P "$MAC_CERT_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"

          MAS_BUILD=1 \
          BUILD_NUMBER="${{ github.run_number }}" \
          MAS_PROVISION_PROFILE="$RUNNER_TEMP/mas.provisionprofile" \
          ./macservice/build_mac_app.sh

      - name: Clean up temporary MAS keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/mac_app.p12" "$RUNNER_TEMP/mac_installer.p12" "$RUNNER_TEMP/mas.provisionprofile" "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security delete-keychain "$RUNNER_TEMP/mas-build.keychain-db" 2>/dev/null || true

      - name: Upload Mac App Store Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnapHavenServer-MAS-pkg
          path: macservice/SnapHavenServer-MAS.pkg
          if-no-files-found: ignore

      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: macservice/SnapHavenServer-macOS.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 3. Build Linux Server (x86_64 Debian .deb & Tarball)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux (Debian .deb & Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: Install System Tray & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev libgtk-3-dev gcc dpkg-dev

      - name: Run Server Unit Tests on Linux Runner
        run: |
          cd server
          go test -v ./...

      - name: Build Linux Debian Package & Tarball
        run: |
          chmod +x linuxservice/build_deb.sh
          ./linuxservice/build_deb.sh

      - name: Upload Linux Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            linuxservice/snaphaven-server_*.deb
            linuxservice/SnapHavenServer-Linux-x86_64.tar.gz
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # 4. Publish Consolidated GitHub Release (with Retry Protection)
  # --------------------------------------------------------------------------
  publish-release:
    name: Publish GitHub Release Assets
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Release Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create Release & Upload Assets with Retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
        run: |
          set -e
          ls -lh release-assets/

          # Ensure the GitHub Release exists (with retry for transient GitHub 5xx errors)
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then
              echo "Release $TAG_NAME already exists; syncing target commit."
              gh release edit "$TAG_NAME" --target "${{ github.sha }}" || true
              break
            fi
            if gh release create "$TAG_NAME" --title "$TAG_NAME" --generate-notes; then
              echo "Created release $TAG_NAME."
              break
            fi
            echo "Attempt $attempt to create release failed; retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done

          # Upload each asset sequentially with --clobber and retry on transient 500s
          for asset in release-assets/*; do
            [ -f "$asset" ] || continue
            echo "Uploading $asset to $TAG_NAME..."
            uploaded=0
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG_NAME" "$asset" --clobber; then
                uploaded=1
                echo "Uploaded $asset"
                break
              fi
              echo "Upload attempt $attempt failed for $asset; retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [ "$uploaded" -ne 1 ]; then
              echo "ERROR: Failed to upload $asset after 5 attempts."
              exit 1
            fi
          done

  # --------------------------------------------------------------------------
  # 4. Build & Publish Multi-Arch Docker Container (GHCR)
  # --------------------------------------------------------------------------
  build-docker:
    name: Build & Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

