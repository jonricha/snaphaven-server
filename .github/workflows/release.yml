name: Multi-Platform Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------------------------------------------------------------------
  # 1. Build Windows Server & Installer
  # --------------------------------------------------------------------------
  build-windows:
    name: Build Windows (NSIS Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Run Server Unit Tests
        run: |
          cd server
          go test -v ./...

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Go Server Executable
        run: |
          cd server
          $TAG = if ("${{ github.ref_name }}" -ne "") { "${{ github.ref_name }}" } else { "v1.0.0" }
          $BUILDDATE = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd HH:mm:ss UTC")
          go build -ldflags "-X 'main.Version=$TAG' -X 'main.Commit=${{ github.sha }}' -X 'main.BuildTime=$BUILDDATE' -H=windowsgui" -o snaphaven.exe .
          Copy-Item snaphaven.exe ..\windowsservice\snaphaven.exe -Force

      - name: Compile NSIS Installer
        run: |
          cd windowsservice
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            & $makensis snaphaven.nsi
          } else {
            makensis snaphaven.nsi
          }

      - name: Upload Windows Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: windowsservice/SnapHavenInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 2. Build macOS Server (Apple Silicon & Intel)
  # --------------------------------------------------------------------------
  build-macos:
    name: Build macOS (ARM64 & AMD64)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Run Server Unit Tests on macOS Runner
        run: |
          cd server
          CGO_ENABLED=1 go test -v ./...

      - name: Build macOS App Bundle & Packaging
        run: |
          chmod +x macservice/build_mac_app.sh
          ./macservice/build_mac_app.sh

      - name: Upload macOS Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: macservice/SnapHavenServer-macOS.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 3. Build Linux Server (x86_64 Debian .deb & Tarball)
  # --------------------------------------------------------------------------
  build-linux:
    name: Build Linux (Debian .deb & Tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: server/go.sum

      - name: Install System Tray & Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev libgtk-3-dev gcc dpkg-dev

      - name: Run Server Unit Tests on Linux Runner
        run: |
          cd server
          go test -v ./...

      - name: Build Linux Debian Package & Tarball
        run: |
          chmod +x linuxservice/build_deb.sh
          ./linuxservice/build_deb.sh

      - name: Upload Linux Release Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            linuxservice/snaphaven-server_1.0.0_amd64.deb
            linuxservice/SnapHavenServer-Linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
