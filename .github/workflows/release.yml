name: Build & Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: server/go.sum

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Build Go Server Executable
        run: |
          cd server
          go build -ldflags -H=windowsgui -o snaphaven.exe .
          Copy-Item snaphaven.exe ..\windowsservice\snaphaven.exe -Force

      - name: Compile NSIS Installer
        run: |
          cd windowsservice
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (Test-Path $makensis) {
            & $makensis snaphaven.nsi
          } else {
            makensis snaphaven.nsi
          }

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: windowsservice/SnapHavenInstaller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
